<!DOCTYPE html>
<html>
<head>
	<title>FMX Markets - Trading Game</title>
	<link rel="stylesheet" href="css/style3.css">
</head>
<body>
<main>
	<div class="header">
		<img id="logo" src="img/logo.png">
		<div class="header-stats">
			<div class="stat-group">
				<span class="stat-label">Price</span>
				<span class="stat-value" id="price">100</span>
			</div>
			<div class="stat-group">
				<span class="stat-label">High</span>
				<span class="stat-value positive" id="maxPrice">100</span>
			</div>
			<div class="stat-group">
				<span class="stat-label">Low</span>
				<span class="stat-value negative" id="minPrice">100</span>
			</div>
			<div class="stat-group">
				<span class="stat-label">10 MA</span>
				<span class="stat-value ma10" id="ma10">—</span>
			</div>
			<div class="stat-group">
				<span class="stat-label">50 MA</span>
				<span class="stat-value ma50" id="ma50">—</span>
			</div>
		</div>
		<img id="avatar" src="img/avatar.jpg">
	</div>

	<div class="game-container">
		<div id="chart-window"></div>

		<div class="hud">
			<div class="bot player-panel">
				<div class="bot-name">You</div>
				<div class="stat-row"><span class="row-label">Capital</span><span class="content" id="capital">1000</span></div>
				<div class="stat-row"><span class="row-label">Holdings</span><span class="content" id="holdings">0</span></div>
				<div class="stat-row"><span class="row-label">Cost</span><span class="content" id="cost">0</span></div>
				<div class="stat-row"><span class="row-label">P/L</span><span class="content" id="rPNL">0</span></div>
			</div>
			<div class="bot">
				<div class="bot-name">Safe Bot</div>
				<div class="stat-row"><span class="row-label">Capital</span><span class="content" id="capital1">1000</span></div>
				<div class="stat-row"><span class="row-label">Holdings</span><span class="content" id="holdings1">0</span></div>
				<div class="stat-row"><span class="row-label">Cost</span><span class="content" id="cost1">0</span></div>
				<div class="stat-row"><span class="row-label">P/L</span><span class="content" id="rPNL1">0</span></div>
			</div>
			<div class="bot">
				<div class="bot-name">Greedy Bot</div>
				<div class="stat-row"><span class="row-label">Capital</span><span class="content" id="capital2">1000</span></div>
				<div class="stat-row"><span class="row-label">Holdings</span><span class="content" id="holdings2">0</span></div>
				<div class="stat-row"><span class="row-label">Cost</span><span class="content" id="cost2">0</span></div>
				<div class="stat-row"><span class="row-label">P/L</span><span class="content" id="rPNL2">0</span></div>
			</div>
			<div class="bot">
				<div class="bot-name">Variable Bot</div>
				<div class="stat-row"><span class="row-label">Capital</span><span class="content" id="capital3">1000</span></div>
				<div class="stat-row"><span class="row-label">Holdings</span><span class="content" id="holdings3">0</span></div>
				<div class="stat-row"><span class="row-label">Cost</span><span class="content" id="cost3">0</span></div>
				<div class="stat-row"><span class="row-label">P/L</span><span class="content" id="rPNL3">0</span></div>
			</div>
			<div class="butt">
				<button id="btnBuy">Buy</button>
				<button id="btnSell">Sell</button>
				<div id="feedback"></div>
			</div>
		</div>
	</div>
</main>
	<script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
	<script type="text/javascript" src="js/script3.js"></script>
</body>
</html>
